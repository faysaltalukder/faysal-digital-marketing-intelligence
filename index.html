<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.49.1';
const SUPABASE_URL='https://tgcabpxzqqokzspyxsaa.supabase.co';
const SUPABASE_KEY='sb_publishable_o-Uc-np_ZhnM5KBdp-V3yQ_sxrVryAm';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const state={user:null,session:null,view:'overview',authMode:'signin',projects:[],tasks:[],research:[],keywords:[],crawls:[],reports:[],rules:[],snapshots:[],search:'',loading:false};

const date=s=>s?new Date(s).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—';
const initials=s=>(s||'FD').split(/[\s@._-]+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('');

const navItems=[['overview','◫','Overview','MAIN'],['projects','▣','Projects'],['audit','◎','Site intelligence'],['research','✳','Research inbox','WORKSPACE'],['keywords','⌗','Keyword clusters'],['workflows','☷','Workflow board'],['reports','▤','Performance reports'],['rules','⚙','Custom rules','SYSTEM'],['settings','⛭','Settings']];
function renderAuth(message='',isError=false){
state.authMode='signin';
$('#root').innerHTML='<div class="authscreen"><section class="authhero">'+logo()+'<div class="hero-copy"><div class="eyebrow">PRIVATE WORKSPACE</div><h1>Your marketing,<br><em>your command center.</em></h1><p>A private workspace for website intelligence, audience research, keyword planning, marketing workflows and performance reports.</p><div class="hero-pills"><span>Single-user access</span><span>Email + password</span><span>Private workspace</span></div></div><div class="authfoot">FAYSAL DIGITAL · PRIVATE MARKETING INTELLIGENCE</div></section><section class="authformwrap"><div class="authbox"><div class="mobilebrand">'+logo()+'</div><div class="eyebrow">AUTHORIZED ACCESS ONLY</div><h2>Sign in to your workspace</h2><p>Enter the email address and password configured for your account.</p><div id="authmessage" class="'+(message?'notice '+(isError?'error':'ok'):'hidden')+'">'+esc(message)+'</div><form id="authform"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required placeholder="Enter your email"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password"></div><button class="btn primary" id="authsubmit" type="submit">Sign in securely ↗</button></form><div class="authmsg">Access is managed by Supabase Auth. Public account creation is not available from this screen.</div><div class="smallprint">If you do not yet have an account, the owner must create it in Supabase Auth. Never share your password or put it in the website source.</div></div></section></div>';
$('#authform').onsubmit=async e=>{e.preventDefault();const btn=$('#authsubmit');const msg=$('#authmessage');btn.disabled=true;btn.textContent='Signing in…';msg.className='hidden';try{const email=$('#email').value.trim(),password=$('#password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;}catch(err){msg.textContent=err.message||'Sign-in failed. Check the email and password.';msg.className='notice error';}finally{if($('#authsubmit')){btn.disabled=false;btn.textContent='Sign in securely ↗'}}};
}
function shell(){
const current=views[state.view]||views.overview;
$('#root').innerHTML='<div class="app"><aside class="sidebar">'+logo()+'<div class="navlabel">WORKSPACE</div><nav class="nav">'+navItems.map(([id,icon,label,section])=>(section?'<div class="navlabel">'+section+'</div>':'')+'<button data-view="'+id+'" class="'+(state.view===id?'active':'')+'"><span class="ico">'+icon+'</span>'+label+'</button>').join('')+'</nav><div class="sidebottom"><div class="connection"><strong><span class="dot"></span> Backend connected</strong><p>Supabase Auth + database<br>Private workspace session</p></div><div class="profile"><div class="avatar">'+initials(state.user?.email)+'</div><div class="profileinfo"><strong>'+esc(state.user?.email||'Workspace user')+'</strong><small>Marketing workspace</small></div><button class="iconbtn" id="logout" title="Sign out">↗</button></div></div></aside><main class="main"><header class="topbar"><div class="crumb">Faysal Digital <span style="padding:0 7px;color:#c0bfb8">/</span> <b>'+esc(current[0])+'</b></div><div class="topactions"><label class="searchbox">⌕ <input id="globalsearch" placeholder="Search this workspace..." value="'+esc(state.search)+'"></label><button class="iconbtn" id="refresh" title="Refresh data">↻</button></div></header><section class="content" id="page"></section></main></div>';
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;renderPage()});
$('#logout').onclick=async()=>{await sb.auth.signOut();state.user=null;state.session=null;renderAuth()};
$('#refresh').onclick=()=>loadData(true);
$('#globalsearch').oninput=e=>{state.search=e.target.value;renderPage()};
renderPage();
}
function matches(item){if(!state.search)return true;return JSON.stringify(item).toLowerCase().includes(state.search.toLowerCase())}
function metric(label,value,note,icon){return '<div class="metric"><div class="metrichead">'+label+'<span class="metricicon">'+icon+'</span></div><div class="metricvalue">'+value+'</div><div class="metricnote">'+note+'</div></div>'}
function empty(icon,title,desc,buttonLabel,action){return '<div class="empty"><div class="emptyicon">'+icon+'</div><strong>'+title+'</strong>'+desc+(buttonLabel?'<div style="margin-top:14px"><button class="btn secondary" data-action="'+action+'">'+buttonLabel+'</button></div>':'')+'</div>'}

function taskList(limit=5){const rows=state.tasks.filter(matches).slice(0,limit);if(!rows.length)return empty('☷','No tasks to track','Add a task to turn a marketing idea into a next action.','Add a task','task');return rows.map(t=>'<div class="task"><button class="taskcheck '+(t.status==='done'?'done':'')+'" data-donetask="'+t.id+'" title="Toggle completed">'+(t.status==='done'?'✓':'')+'</button><div class="taskmain"><strong style="'+(t.status==='done'?'text-decoration:line-through;color:#999':'')+'">'+esc(t.title)+'</strong><p>'+esc(t.description||'No description')+'</p><div class="taskmeta"><span class="pill '+(t.status==='done'?'green':t.status==='in_progress'?'blue':t.status==='blocked'?'red':'')+'">'+esc((t.status||'todo').replace('_',' '))+'</span>'+(t.due_at?'<span class="pill">Due '+date(t.due_at)+'</span>':'')+'</div></div></div>').join('')}

ssion and access rules are active.</p></div></div><div class="task"><span class="metricicon">▤</span><div class="taskmain"><strong>Performance reports</strong><p>'+state.reports.length+' imported report(s) in this workspace.</p></div></div><div class="task"><span class="metricicon">⌗</span><div class="taskmain"><strong>Keyword planning</strong><p>'+state.keywords.length+' keyword cluster(s) saved.</p></div></div></div></div></div>'}

function renderAudit(){const rows=state.crawls.filter(matches);return '<div class="sectionhead"><div><div class="eyebrow">WEBSITE INTELLIGENCE</div><h2>Site intelligence</h2><p>Queue a bounded site crawl for a project and keep job status in the database. The queue is connected; the crawler worker still needs to be implemented before jobs will actually fetch pages.</p></div><button class="btn primary" data-action="crawl">＋ Queue crawl</button></div><div class="notice">Crawler status: job queue and page-snapshot storage are ready. Actual page fetching is not yet active, so queued jobs will remain queued until a crawl worker is deployed.</div><div class="metrics">'+metric('Crawl jobs',state.crawls.length,'Jobs saved in this account','◎')+metric('Queued',state.crawls.filter(x=>x.status==='queued').length,'Waiting for a worker','◷')+metric('Completed',state.crawls.filter(x=>x.status==='completed').length,'Finished jobs','✓')+metric('Saved snapshots',state.snapshots.length,'Extracted page records','▤')+'</div><div class="grid2"><div class="panel"><div class="panelhead"><div><div class="paneltitle">Crawl queue</div><div class="panelsub">Bounded, same-domain jobs</div></div></div><div class="panelbody">'+(rows.length?'<div class="tablewrap"><table class="table"><thead><tr><th>URL</th><th>Pages</th><th>Status</th><th>Created</th></tr></thead><tbody>'+rows.map(c=>'<tr><td style="white-space:normal;max-width:270px">'+esc(c.start_url)+'</td><td>'+c.pages_scanned+' / '+c.max_pages+'</td><td><span class="pill '+(c.status==='completed'?'green':c.status==='failed'?'red':'orange')+'">'+esc(c.status)+'</span></td><td>'+date(c.created_at)+'</td></tr>').join('')+'</tbody></table></div>':empty('◎','No crawl jobs yet','Choose a project and queue a bounded crawl.','Queue crawl','crawl'))+'</div></div><div class="panel"><div class="panelhead"><div><div class="paneltitle">Recent page snapshots</div><div class="panelsub">Titles, headings, text and CTAs when fetched</div></div></div><div clas function renderResearch(){return '<div class="sectionhead"><div><div class="eyebrow">CUSTOMER & COMPETITOR INTELLIGENCE</div><h2>Research inbox</h2><p>Capture real customer language, pain points, questions, offers, calls to action and competitor observations. Store a source link whenever possible.</p></div><button class="btn primary" data-action="research">＋ Capture insight</button></div><div class="panel"><div class="panelhead"><div><div class="paneltitle">All insights</div><div class="panelsub">'+state.research.length+' saved item(s)</div></div><div class="filters"><span class="pill">Private to your account</span></div></div><div class="panelbody">'+researchTable(200)+'</div></div>'}

function renderReports(){const rows=state.reports.filter(matches);return '<div class="sectionhead"><div><div class="eyebrow">CAMPAIGN ANALYTICS</div><h2>Performance reports</h2><p>Import a CSV export from your ad or analytics platform. Uploads are parsed in your browser, summarized and saved to your account. No advertising API connection is implied.</p></div><button class="btn primary" data-action="report">＋ Import CSV</button></div><div class="notice">Privacy note: CSV data is stored in your Supabase database as structured report rows. Review exports before importing; never include passwords, tokens or payment details.</div><div class="panel"><div class="panelhead"><div><div class="paneltitle">Report history</div><div class="panelsub">'+state.reports.length+' imported report(s)</div></div></div><div class="panelbody">'+(rows.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Report</th><th>Platform</th><th>Rows</th><th>Date range</th><th>Imported</th><th></th></tr></thead><tbody>'+rows.map(r=>'<tr><td><strong>'+esc(r.report_name)+'</strong></td><td>'+esc(r.platform||'CSV import')+'</td><td>'+r.row_count+'</td><td>'+date(r.date_from)+' – '+date(r.date_to)+'</td><td>'+date(r.imported_at)+'</td><td><button class="btn secondary" data-downloadreport="'+r.id+'">Export CSV</button></td></tr>').join('')+'</tbody></table></div>':empty('▤','No reports imported yet','Upload a clean CSV export to begin tracking report history.','Import CSV','report'))+'</div></div>'}
function renderRules(){const rows=state.rules.filter(matches);return '<div class="sectionhead"><div><div class="eyebrow">REPEATABLE LOGIC</div><h2>Custom rules</h2><p>Document lightweight rules for your workflow. Rules are saved as configuration; automated rule execution is a future step.</p></div><button class="btn primary" data-action="rule">＋ Create rule</button></div><div class="panel"><div class="panelhead"><div><div class="paneltitle">Your rules</div><div class="panelsub">'+state.rules.length+' saved rule(s)</div></div></div><div class="panelbody">'+(rows.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Type</th><th>State</th><th>Created</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><strong>'+esc(r.name)+'</strong></td><td>'+esc(r.rule_type)+'</td><td><span class="pill '+(r.enabled?'green':'')+'">'+(r.enabled?'Enabled':'Disabled')+'</span></td><td>'+date(r.created_at)+'</td></tr>').join('')+'</tbody></table></div>':empty('⚙','No custom rules','Add a named rule and configuration to document a repeatable check.','Create rule','rule'))+'</div></div>'}

function renderPage(){if(!state.user){renderAuth();return}const page=$('#page');if(!page)return;const html={overview:renderOverview,projects:renderProjects,audit:renderAudit,research:renderResearch,keywords:renderKeywords,workflows:renderWorkflows,reports:renderReports,rules:renderRules,settings:renderSettings};page.innerHTML=(html[state.view]||renderOverview)();document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;renderPage()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>openModal(b.dataset.action));document.querySelectorAll('[data-donetask]').forEach(b=>b.onclick=()=>toggleTask(b.dataset.donetask));document.querySelectorAll('[data-downloadreport]').forEach(b=>b.onclick=()=>downloadReport(b.dataset.downloadreport));if($('#settingslogout'))$('#settingslogout').onclick=$('#logout').onclick}
async function getRows(table,sort='created_at'){const {data,error}=await sb.from(table).select('*').eq('user_id',state.user.id).order(sort,{ascending:false}).limit(250);if(error)throw error;return data||[]}

else if(kind==='research'){await insert('research_items',{user_id:state.user.id,project_id:fd.get('project_id')||null,item_type:fd.get('item_type'),value:fd.get('value').trim(),intent:fd.get('intent')||null,source_url:fd.get('source_url')||null,tags:String(fd.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean)})}
else if(kind==='task'){const due=fd.get('due_at');await insert('workflow_tasks',{user_id:state.user.id,project_id:fd.get('project_id'),title:fd.get('title').trim(),description:fd.get('description')||null,status:fd.get('status')||'todo',due_at:due?new Date(due+'T23:59:00').toISOString():null})}
else if(kind==='keyword'){const kw=String(fd.get('keywords')).split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);const conf=fd.get('confidence');await insert('keyword_clusters',{user_id:state.user.id,project_id:fd.get('project_id'),name:fd.get('name').trim(),intent:fd.get('intent')||null,keywords:kw,notes:fd.get('notes')||null,confidence:conf?Number(conf)/100:null})}
else if(kind==='crawl'){await insert('crawl_jobs',{user_id:state.user.id,project_id:fd.get('project_id'),start_url:fd.get('start_url').trim(),same_domain_only:fd.get('same_domain_only')==='true',max_pages:Number(fd.get('max_pages')),status:'queued'})}
else if(kind==='rule'){let config={};try{config=JSON.parse(fd.get('config')||'{}')}catch{throw new Error('Configuration must be valid JSON.')}await insert('custom_rules',{user_id:state.user.id,project_id:fd.get('project_id'),name:fd.get('name').trim(),rule_type:fd.get('rule_type'),config,enabled:true})}
else if(kind==='report'){const file=fd.get('csvfile');const text=await file.text();const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)throw new Error('CSV should include a header row and at least one data row.');const headers=parseCSVLine(lines[0]);const rows=lines.slice(1,1001).map(line=>{const cells=parseCSVLine(line);const row={};headers.forEach((h,i)=>row[h||('column_'+i)]=cells[i]??'');return row});const dates=rows.map(r=>r.Date||r.date||r['Reporting starts']||r['Start date']).filter(Boolean).sort();const metrics={};for(const h of headers){const nums=rows.map(r=>Number(String(r[h]||'').replace(/[$,%]/g,''))).filter(n=>Number.isFinite(n)&&String(n)!=='');if(nums.length&&/(spend|cost|purchase|conversion|click|impression|reach|revenue|value|result|roas|ctr|cpc|cpa)/i.test(h)){metrics[h]={sum:nums.reduce((a,b)=>a+b,0),average:nums.reduce((a,b)=>a+b,0)/nums.length}}}await insert('performance_reports',{user_id:state.user.id,project_id:fd.get('project_id'),report_name:fd.get('report_name').trim(),platform:fd.get('platform'),date_from:parseDate(dates[0]),date_to:parseDate(dates[dates.length-1]),row_count:rows.length,metrics_summary:metrics,report_rows:rows})}
close();await loadData();toast('Saved successfully.')}catch(err){console.error(err);toast(err.message||'Could not save item. Check database permissions.','error');btn.disabled=false;btn.textContent='Save item'}};
}
function parseCSVLine(line){const out=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out}
function parseDate(s){if(!s)return null;const d=new Date(s);return Number.isNaN(d.getTime())?null:d.toISOString().slice(0,10)}
async function insert(table,row){const {error}=await sb.from(table).insert(row);if(error)throw error}
async function toggleTask(id){const task=state.tasks.find(t=>t.id===id);if(!task)return;const next=task.status==='done'?'todo':'done';const {error}=await sb.from('workflow_tasks').update({status:next,completed_at:next==='done'?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',id).eq('user_id',state.user.id);if(error){toast(error.message,'error');return}await loadData()}
function csvCell(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function downloadReport(id){const r=state.reports.find(x=>x.id===id);if(!r)return;const rows=r.report_rows||[];if(!rows.length){toast('No row data is stored in this report.','error');return}const headers=Object.keys(rows[0]);const csv=[headers.map(csvCell).join(','),...rows.map(row=>headers.map(h=>csvCell(row[h])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=(r.report_name||'report').replace(/[^\w-]+/g,'-')+'.csv';a.click();URL.revokeObjectURL(url)}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){state.view=v.dataset.view;renderPage()}});
sb.auth.onAuthStateChange((_event,session)=>{state.session=session;state.user=session?.user||null;if(state.user){shell();loadData()}else{renderAuth()}});
const {data:{session}}=await sb.auth.getSession();state.session=session;state.user=session?.user||null;if(state.user){shell();await loadData()}else renderAuth();
</script>
